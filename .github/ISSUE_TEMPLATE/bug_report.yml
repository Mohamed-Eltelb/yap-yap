name: Bug report
description: Report a problem with Yap Yap
body:
  - type: input
    id: environment
    attributes:
      label: App version and operating system
      placeholder: "For example, v1.0.0 on Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the mode and provider if relevant. Use sample text and redact keys and personal information.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
