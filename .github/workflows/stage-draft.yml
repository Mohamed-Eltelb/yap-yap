name: Stage draft installers

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful manual Desktop CI run on main
        required: true
        type: string
      tag:
        description: Existing draft release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: draft-installers-${{ inputs.tag }}

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Verify the source run and draft refer to the same version
        shell: bash
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          sha=$(jq -er 'select(.path == ".github/workflows/desktop.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .conclusion == "success") | .head_sha' <<<"$run")
          version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$sha" -H 'Accept: application/vnd.github.raw+json' | jq -er .version)
          [[ "$TAG" == "v$version" ]]
          gh release view "$TAG" --json isDraft,targetCommitish |
            jq -e --arg sha "$sha" '.isDraft and .targetCommitish == $sha'
      - name: Collect installers, update metadata, and SHA-256 checksums
        shell: bash
        run: |
          version=${TAG#v}
          gh run download "$RUN_ID" --name yap-yap-Windows-X64 --dir windows
          gh run download "$RUN_ID" --name yap-yap-macOS-ARM64 --dir macos
          gh run download "$RUN_ID" --name yap-yap-Linux-X64 --dir linux
          mkdir assets
          # electron-builder names the files (artifactName in package.json). latest*.yml refer to these
          # exact names, so they must not be renamed.
          cp "windows/Yap-Yap-$version-windows-x64.exe" "windows/Yap-Yap-$version-windows-x64.exe.blockmap" windows/latest.yml assets/
          cp "macos/Yap-Yap-$version-macos-arm64.dmg" assets/
          cp "linux/Yap-Yap-$version-linux-x64.AppImage" linux/latest-linux.yml assets/
          grep -q "path: Yap-Yap-$version-windows-x64.exe" assets/latest.yml
          grep -q "path: Yap-Yap-$version-linux-x64.AppImage" assets/latest-linux.yml
          cd assets
          sha256sum Yap-Yap-$version-windows-x64.exe Yap-Yap-$version-macos-arm64.dmg Yap-Yap-$version-linux-x64.AppImage > SHA256SUMS.txt
      - name: Attach files to the draft and verify GitHub's digests
        shell: bash
        working-directory: assets
        run: |
          existing=$(gh release view "$TAG" --json isDraft,assets)
          jq -e '.isDraft' <<<"$existing"
          for file in *; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            remote=$(jq -r --arg name "$file" '.assets[] | select(.name == $name) | .digest' <<<"$existing")
            if [[ -z "$remote" ]]; then
              gh release upload "$TAG" "$file"
            elif [[ "$remote" != "$digest" ]]; then
              echo "An asset named $file already exists with a different checksum."
              exit 1
            fi
          done
          result=$(gh release view "$TAG" --json isDraft,assets)
          for file in *; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg name "$file" --arg digest "$digest" \
              '.isDraft and any(.assets[]; .name == $name and .digest == $digest)' <<<"$result"
          done
