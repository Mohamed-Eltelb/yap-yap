<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yap Yap</title>
    <link rel="icon" type="image/png" href="/icons/app.png" />
    <script>
      // Pick the theme before first paint so the window never flashes the wrong color.
      (function () {
        var root = document.documentElement;
        if (location.hash === '#/hud') {
          root.classList.add('hud-mode');
          return;
        }
        var mode = null;
        try {
          mode = localStorage.getItem('yapyap_appearance');
        } catch (e) {}
        var systemDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        if (mode === 'dark' || ((mode === 'system' || !mode) && systemDark)) {
          root.classList.add('dark');
        }
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #141416;
        transition: opacity 0.2s ease;
        -webkit-app-region: drag;
      }
      html.dark #splash {
        background: #242121;
        color: #f2f1f0;
      }
      html.hud-mode #splash {
        display: none;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 72px;
        height: 72px;
        animation: splash-in 0.35s ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M5.5 5.2C11.4 4.2 17.5 6.9 19.2 12.2C19.8 14.2 19.3 16.5 17.8 18.2C16.2 19.9 13.7 20.3 11.7 19.1C10.5 18.4 9.7 17.1 9.5 15.6C9.3 13.7 10.6 11.9 12.5 11.4C13.7 11.1 14.9 11.7 15.4 12.7C14.1 12.6 12.9 13.5 12.7 14.8C12.6 15.9 13.4 16.9 14.5 17C15.8 17.1 16.7 15.8 16.4 14.2C15.9 11.1 12.8 8.9 8.7 8.8C7.1 8.8 5.7 9.2 4.6 9.8C4.4 8.1 4.7 6.4 5.5 5.2Z"
          fill="currentColor"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
